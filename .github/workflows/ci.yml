name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        mcp: ["mcp>=1.25,<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p ${{ matrix.python }}
      - run: uv pip install -e '.[dev]' '${{ matrix.mcp }}'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy charles5_mcp
      - run: uv run --no-sync pytest -q
